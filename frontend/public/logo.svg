<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Global Monitor">
  <!-- Dark tile so the mark reads the same on light and dark surfaces without
       a media query (same reason the favicon keeps its own tile). -->
  <rect width="32" height="32" rx="7.5" fill="#101214"/>
  <rect x="0.6" y="0.6" width="30.8" height="30.8" rx="7" fill="none" stroke="#ffffff" stroke-opacity="0.07"/>
  <!-- Reticle in the negative-space channels: the "monitor" half of the
       mark. Sits only in the 4px gap between squares, never over them. -->
  <path d="M16 6.5v19M6.5 16h19" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.25" stroke-linecap="round"/>
  <!-- Four squares, one per bloc (same hexes as the palette in colors.ts). -->
  <rect x="6" y="6" width="8" height="8" rx="2.2" fill="#3987e5"/>
  <rect x="18" y="6" width="8" height="8" rx="2.2" fill="#c98500"/>
  <rect x="6" y="18" width="8" height="8" rx="2.2" fill="#008300"/>
  <rect x="18" y="18" width="8" height="8" rx="2.2" fill="#d55181"/>
</svg>
